name: AWS Marketplace Source AMI Release

on:
  workflow_dispatch:
    inputs:
      penpot_release_version:
        description: "Optional Penpot release version override, for example 1.0.0 or v1.0.0"
        required: false
        type: string
      build_variant:
        description: "Optional AMI build variant suffix, for example hardened or seller"
        required: false
        type: string

jobs:
  build-marketplace-source-ami:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_MARKETPLACE_SOURCE_REGION || 'us-east-1' }}
      PROJECT_TAG: ${{ vars.PROJECT_TAG || 'penpot-cloud-image-aws' }}
      AWS_VPC_ID: ${{ vars.AWS_MARKETPLACE_VPC_ID }}
      AWS_SUBNET_ID: ${{ vars.AWS_MARKETPLACE_SUBNET_ID }}
      PENPOT_RELEASE_VERSION: ${{ inputs.penpot_release_version }}
      BUILD_VARIANT: ${{ inputs.build_variant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Marketplace build inputs
        run: |
          set -euo pipefail

          missing_vars=()

          for var_name in AWS_VPC_ID AWS_SUBNET_ID; do
            if [[ -z "${!var_name:-}" ]]; then
              missing_vars+=("$var_name")
            fi
          done

          if [[ "${AWS_REGION}" != "us-east-1" ]]; then
            echo "AWS Marketplace source AMIs must be built from us-east-1. Current region: ${AWS_REGION}" >&2
            exit 1
          fi

          if [[ ${#missing_vars[@]} -gt 0 ]]; then
            printf 'missing required Marketplace workflow variable: %s\n' "${missing_vars[@]}" >&2
            exit 1
          fi

      - name: Resolve Penpot release tag
        id: penpot_release
        uses: actions/github-script@v7
        with:
          script: |
            const override = process.env.PENPOT_RELEASE_VERSION;
            if (override && override.trim() !== '') {
              core.setOutput('tag', override.trim());
              core.info(`Using manual Penpot release override: ${override.trim()}`);
              return;
            }

            const release = await github.rest.repos.getLatestRelease({
              owner: 'penpot',
              repo: 'penpot'
            });

            core.setOutput('tag', release.data.tag_name);
            core.info(`Resolved latest Penpot release: ${release.data.tag_name}`);

      - name: Normalize Penpot release version
        id: release_version
        env:
          PENPOT_RELEASE_TAG: ${{ steps.penpot_release.outputs.tag }}
        run: |
          version=$(bash clouds/aws/scripts/get-release-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved Penpot release version: $version"

      - name: Validate AWS assets
        run: bash clouds/aws/scripts/validate.sh

      - name: Build Marketplace source AMI
        id: build_ami
        run: |
          set -euo pipefail

          packer_args=(
            build
            -machine-readable
            -var "aws_region=${AWS_REGION}"
            -var "project_tag=${PROJECT_TAG}"
            -var "release_version=${{ steps.release_version.outputs.version }}"
            -var "vpc_id=${AWS_VPC_ID}"
            -var "subnet_id=${AWS_SUBNET_ID}"
          )

          if [[ -n "${BUILD_VARIANT}" ]]; then
            packer_args+=(-var "build_variant=${BUILD_VARIANT}")
          fi

          packer_args+=(clouds/aws/packer/single-node.pkr.hcl)

          packer "${packer_args[@]}" | tee packer-output.log

          ami_id=$(awk -F, '/artifact,0,id/ {split($NF, a, ":"); print a[2]}' packer-output.log | tail -n1)

          if [[ -z "$ami_id" ]]; then
            echo "Unable to determine AMI ID from Packer output" >&2
            exit 1
          fi

          echo "ami_id=$ami_id" >> "$GITHUB_OUTPUT"
          echo "Built Marketplace source AMI ID: $ami_id"

      - name: Publish build summary
        run: |
          {
            echo "## AWS Marketplace Source AMI Release"
            echo
            echo "- Source region: ${{ env.AWS_REGION }}"
            echo "- Penpot release version: ${{ steps.release_version.outputs.version }}"
            echo "- Build variant: ${{ inputs.build_variant || 'default' }}"
            echo "- Source AMI ID: ${{ steps.build_ami.outputs.ami_id }}"
            echo
            echo "This workflow builds the source AMI to register in AWS Marketplace."
          } >> "$GITHUB_STEP_SUMMARY"
